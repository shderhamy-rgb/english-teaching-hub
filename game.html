<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Championship Arena v5.0 — Pro Teacher Edition</title>
<style>
:root{--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--line:#e2e8f0;--bg:#eef2f8;--paper:#ffffff;--blue:#2563eb;--blue-d:#1e40af;--blue-l:#dbeafe;--green:#16a34a;--green-d:#15803d;--green-l:#dcfce7;--amber:#f59e0b;--amber-l:#fef3c7;--amber-d:#92400e;--red:#dc2626;--red-l:#fee2e2;--purple:#9333ea;--purple-d:#6b21a8;--purple-l:#f3e8ff;--teal:#0d9488;--teal-d:#0f766e;--teal-l:#ccfbf1;--gold:#f5c542;--gold-d:#a16207;--sh:0 4px 14px rgba(15,23,42,.07);--shl:0 14px 34px rgba(15,23,42,.15);--ease:cubic-bezier(.34,1.2,.64,1);--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh;user-select:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
header{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:.55rem 1rem;display:flex;align-items:center;gap:.55rem;flex:none;box-shadow:0 2px 12px rgba(15,23,42,.22);position:sticky;top:0;z-index:30;}
header .logo{width:36px;height:36px;border-radius:10px;background:var(--gold);color:#0f172a;display:grid;place-items:center;font-weight:900;font-size:1.05rem;flex:none}
header .ttl{font-weight:900;font-size:.95rem;letter-spacing:-.01em;line-height:1.1;flex:1}
header .ttl small{display:block;font-weight:500;font-size:.68rem;opacity:.8}
header .hbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:.4rem .7rem;font-weight:800;font-size:.76rem;min-height:36px;display:inline-flex;align-items:center;gap:.3rem;transition:all .15s;}
header .hbtn:hover{background:rgba(255,255,255,.26)} header .hbtn.on{background:var(--gold);color:#0f172a}
main{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:clamp(.7rem,1.5vw,1.3rem)}
.screen{display:none} .screen.on{display:block;animation:fadeIn .28s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#0f172a,#2563eb 52%,#7c3aed);color:#fff;border-radius:20px;padding:clamp(.9rem,2.2vw,1.5rem);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.85rem;box-shadow:var(--shl);position:relative;overflow:hidden;}
.hero h1{font-size:clamp(1.25rem,2.8vw,1.85rem);letter-spacing:-.03em;line-height:1.08}
.hero p{font-size:clamp(.78rem,1.2vw,.92rem);opacity:.92;font-weight:600;margin-top:.2rem}
.mode-pills{display:flex;gap:.4rem;flex-wrap:wrap}
.mode-pill{padding:.5rem .8rem;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:.76rem;border:2px solid transparent;display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;transition:all .15s;}
.mode-pill small{font-size:.63rem;opacity:.82;font-weight:600}
.mode-pill:hover{background:rgba(255,255,255,.24)}
.mode-pill.on{background:#fff;color:var(--ink);border-color:var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.mode-pill.on small{color:var(--ink2)}
.pool-bar{background:#fff;border-radius:14px;padding:.55rem .85rem;margin-bottom:.8rem;box-shadow:var(--sh);display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;border-left:5px solid var(--blue);}
.pool-bar .label{font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.pool-bar .chips{display:flex;gap:.25rem;flex-wrap:wrap;flex:1;min-width:160px;max-height:48px;overflow:hidden}
.pool-bar .chip{padding:.18rem .46rem;border-radius:6px;font-weight:900;font-size:.75rem;background:var(--blue-l);color:var(--blue-d);font-family:Georgia,serif}
.pool-bar .chip.num{background:var(--green-l);color:var(--green-d);font-family:var(--font)}
.pool-bar .edit-btn{padding:.38rem .75rem;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;font-size:.76rem;min-height:34px}
.picker{background:#fff;border-radius:16px;padding:.9rem 1rem;margin-bottom:.85rem;box-shadow:var(--sh);display:none}
.picker.open{display:block;animation:fadeIn .25s var(--ease)}
.picker h3{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:.45rem;display:flex;align-items:center;gap:.5rem}
.picker h3 .count{background:var(--blue-l);color:var(--blue-d);padding:.12rem .45rem;border-radius:99px;font-size:.65rem}
.presets{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.6rem}
.presets button{padding:.36rem .62rem;border-radius:8px;background:#f1f5f9;color:var(--ink2);font-weight:700;font-size:.73rem;min-height:32px}
.presets button:hover{background:#e2e8f0} .presets button.primary{background:var(--blue);color:#fff}
.letter-grid-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:.28rem;margin-bottom:.8rem}
.lchip{aspect-ratio:1;border-radius:10px;background:#f1f5f9;font-weight:900;font-size:.95rem;color:var(--ink2);font-family:Georgia,serif;display:grid;place-items:center;position:relative;border:2px solid transparent;min-height:38px}
.lchip.on{background:var(--blue);color:#fff;border-color:var(--blue-d)}
.lchip.on::after{content:"✓";position:absolute;top:1px;right:3px;font-size:.5rem}
.settings-card{background:#fff;border-radius:14px;padding:.75rem 1rem;box-shadow:var(--sh);margin-bottom:.85rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.5rem 1.2rem; position: relative;}
.settings-row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:.25rem 0}
.settings-row .lbl{font-size:.74rem;font-weight:900;color:var(--ink2);min-width:85px}
.settings-row .opts{display:flex;gap:.25rem;flex-wrap:wrap;flex:1}
.settings-row button{padding:.32rem .58rem;border-radius:8px;background:#f1f5f9;color:var(--ink2);font-weight:800;font-size:.72rem;min-height:31px}
.settings-row button.on{background:var(--blue);color:#fff}
.settings-row input[type=text]{padding:.32rem .5rem;border:1.5px solid var(--line);border-radius:8px;font-weight:800;font-size:.78rem;width:105px}
.export-panel{grid-column: 1 / -1; margin-top: .5rem; padding-top: .8rem; border-top: 2px dashed var(--line); display:flex; justify-content:flex-end; align-items:center; gap: 1rem;}
.export-panel p {font-size: .75rem; color: var(--ink2); font-weight: 600;}
.export-btn{background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;padding:.6rem 1.2rem;border-radius:10px;font-weight:900;font-size:.85rem;box-shadow:0 4px 12px rgba(147,51,234,.3);display:inline-flex;align-items:center;gap:.4rem;}
.export-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(147,51,234,.4);}
.section-title{font-size:clamp(.92rem,1.6vw,1.1rem);font-weight:900;margin:1rem 0 .55rem;display:flex;align-items:center;gap:.5rem}
.section-title .pill{font-size:.62rem;padding:.16rem .5rem;border-radius:99px;font-weight:900;text-transform:uppercase}
.pill.l{background:var(--blue-l);color:var(--blue-d)} .pill.n{background:var(--green-l);color:var(--green-d)} .pill.m{background:var(--purple-l);color:var(--purple-d)}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.65rem}
.game-card{background:#fff;border-radius:15px;padding:.8rem;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;gap:.35rem;transition:transform .16s var(--ease),box-shadow .16s,border-color .16s;border:2.5px solid transparent;min-height:136px}
.game-card:hover{transform:translateY(-3px);box-shadow:var(--shl)}
.game-card.letters:hover{border-color:var(--blue)} .game-card.numbers:hover{border-color:var(--green)} .game-card.mixed:hover{border-color:var(--purple)}
.game-card .top-row{display:flex;justify-content:space-between;align-items:center}
.game-card .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;font-weight:900}
.game-card.letters .ico{background:var(--blue-l);color:var(--blue-d)} .game-card.numbers .ico{background:var(--green-l);color:var(--green-d)} .game-card.mixed .ico{background:var(--purple-l);color:var(--purple-d)}
.game-card h3{font-size:.88rem;font-weight:900;line-height:1.15}
.game-card .desc{font-size:.72rem;color:var(--ink2);line-height:1.32;flex:1}
.game-card .tag{font-size:.62rem;font-weight:800;text-transform:uppercase;color:var(--ink3);padding-top:.3rem;border-top:1px dashed var(--line);display:flex;justify-content:space-between}
.game-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.game-top .back{background:#fff;border-radius:10px;padding:.4rem .75rem;font-weight:800;font-size:.76rem;color:var(--blue);box-shadow:var(--sh);min-height:36px}
.game-top .title{flex:1;min-width:140px} .game-top .title h2{font-size:clamp(.92rem,1.8vw,1.25rem)} .game-top .title .sub{font-size:.68rem;color:var(--ink2);font-weight:700}
.game-top .round-pill{padding:.35rem .7rem;border-radius:99px;background:#fff;box-shadow:var(--sh);font-weight:800;font-size:.74rem;color:var(--ink2)}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;margin-bottom:.55rem}
.pcard{background:#fff;border-radius:14px;padding:.5rem .75rem;display:flex;align-items:center;gap:.55rem;border:3px solid #cbd5e1;box-shadow:var(--sh);transition:all .25s var(--ease);position:relative;overflow:hidden}
.pcard.active.p1{border-color:var(--blue);box-shadow:0 6px 20px rgba(37,99,235,.22)} .pcard.active.p2{border-color:var(--purple);box-shadow:0 6px 20px rgba(147,51,234,.22)}
.pcard .avatar{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:1.15rem}
.pcard.p1 .avatar{background:var(--blue-l)} .pcard.p2 .avatar{background:var(--purple-l)}
.pcard .info{flex:1;min-width:0} .pcard .nm{font-weight:900;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.p1 .nm{color:var(--blue-d)} .pcard.p2 .nm{color:var(--purple-d)}
.pcard .streak{font-size:.64rem;font-weight:800;color:var(--amber-d);min-height:.8rem}
.pcard .score{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;font-variant-numeric:tabular-nums}
.pcard.p1 .score{color:var(--blue-d)} .pcard.p2 .score{color:var(--purple-d)}
.pcard .score.pop{animation:scorePop .45s var(--ease)}
@keyframes scorePop{0%{transform:scale(1)}45%{transform:scale(1.38);color:var(--green)}100%{transform:scale(1)}}
.scoreboard .vs{align-self:center;padding:.28rem .55rem;background:#0f172a;color:#fff;border-radius:99px;font-weight:900;font-size:.64rem}
.tug-wrap{background:#fff;border-radius:14px;padding:.55rem .85rem;margin-bottom:.6rem;box-shadow:var(--sh);display:none} .tug-wrap.on{display:block}
.tug-labels{display:flex;justify-content:space-between;font-size:.7rem;font-weight:900;margin-bottom:.3rem}
.tug-track{height:18px;background:linear-gradient(90deg,var(--blue-l) 0%,#f1f5f9 50%,var(--purple-l) 100%);border-radius:99px;position:relative;border:2px solid #cbd5e1;overflow:hidden}
.tug-center-line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#475569;transform:translateX(-50%)}
.tug-rope{position:absolute;top:50%;left:50%;width:32px;height:32px;margin-top:-16px;margin-left:-16px;border-radius:50%;background:var(--gold);border:3px solid #0f172a;display:grid;place-items:center;font-size:.9rem;transition:left .3s var(--ease);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.progress-bar{height:7px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:.45rem}
.progress-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .35s var(--ease)}
.timer-row{display:none;align-items:center;gap:.5rem;margin-bottom:.6rem} .timer-row.on{display:flex}
.timer-badge{padding:.2rem .55rem;border-radius:8px;background:#fff;font-weight:900;font-size:.76rem;box-shadow:var(--sh);min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.timer-bar{flex:1;height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden} .timer-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));transition:width .1s linear}
.stage-single{background:#fff;border-radius:20px;padding:clamp(.8rem,1.6vw,1.25rem);box-shadow:var(--sh);text-align:center;position:relative}
.stage-split{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-items:stretch}
.split-pane{background:#fff;border-radius:18px;padding:.85rem;box-shadow:var(--sh);text-align:center;border:3px solid transparent;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.split-pane.p1{border-color:var(--blue-l)} .split-pane.p2{border-color:var(--purple-l)}
.split-pane .pane-head{display:flex;justify-content:space-between;align-items:center;padding:.3rem .6rem;border-radius:10px;font-weight:900;font-size:.76rem;margin-bottom:.45rem}
.split-pane.p1 .pane-head{background:var(--blue-l);color:var(--blue-d)} .split-pane.p2 .pane-head{background:var(--purple-l);color:var(--purple-d)}
.freeze-overlay{position:absolute;inset:0;background:rgba(15,23,42,.82);backdrop-filter:blur(4px);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;font-weight:900} .freeze-overlay.on{display:flex;animation:fadeIn .15s}
.q-prompt{font-size:clamp(.88rem,1.5vw,1.1rem);font-weight:900;margin-bottom:.45rem;line-height:1.3} .q-prompt b{color:var(--blue-d)}
.q-display{display:flex;justify-content:center;align-items:center;margin:.45rem 0;min-height:110px;flex-wrap:wrap;gap:.5rem;position:relative}
.big-letter{font-size:clamp(3.6rem,9vw,6.8rem);font-weight:800;line-height:1;color:var(--blue);font-family:Georgia,serif;animation:popIn .3s var(--ease)}
.big-letter.lo{color:var(--purple)} .big-letter.num{color:var(--green-d);font-family:var(--font)}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.seq{display:flex;gap:clamp(.25rem,.8vw,.65rem);align-items:center;justify-content:center;font-family:Georgia,serif;flex-wrap:wrap}
.seq span{font-size:clamp(1.6rem,4.2vw,3.1rem);font-weight:800;color:var(--blue);padding:.1rem .25rem}
.seq span.blank{color:var(--amber-d);background:var(--amber-l);border-bottom:4px solid var(--amber);border-radius:8px;padding:0 .35em}
.seq span.num{color:var(--green-d);font-family:var(--font)}
.emoji-Card{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.emoji-big{font-size:clamp(3.2rem,7vw,5rem);line-height:1.05;filter:drop-shadow(0 4px 8px rgba(0,0,0,.1))}
.word-tag{font-size:clamp(1.2rem,2.6vw,1.8rem);font-weight:900;color:var(--blue-d);font-family:Georgia,serif;letter-spacing:.02em}
.objects-grid{display:flex;flex-wrap:wrap;gap:.32rem;justify-content:center;max-width:440px;margin:0 auto} .objects-grid .obj-item{font-size:clamp(1.45rem,2.8vw,2.1rem);line-height:1;animation:popIn .22s var(--ease) backwards}
.ten-frame{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#f8fafc;border:3px solid #334155;border-radius:12px;padding:8px;max-width:240px;margin:0 auto}
.tf-cell{width:34px;height:34px;border:2px solid #cbd5e1;border-radius:8px;display:grid;place-items:center}
.tf-dot{width:22px;height:22px;border-radius:50%;background:var(--blue);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)} .tf-dot.alt{background:var(--red)}
.blur-target{filter:blur(26px);opacity:.4;user-select:none;pointer-events:none;transition:all .4s} .blur-target.revealed{filter:none;opacity:1}
.action-row {display: flex; justify-content: center; gap: .5rem; flex-wrap: wrap; margin: .3rem 0 .5rem;}
.listen-btn, .hint-btn {display: inline-flex; align-items: center; gap: .35rem; color: #fff; font-weight: 900; font-size: .78rem; padding: .45rem .95rem; border-radius: 10px;}
.listen-btn {background: linear-gradient(135deg, #f59e0b, #ea580c); box-shadow: 0 3px 10px rgba(245, 158, 11, .3);}
.hint-btn {background: linear-gradient(135deg, var(--teal), var(--teal-d)); box-shadow: 0 3px 10px rgba(13, 148, 136, .3);}
.hint-box {display: none; background: #f1f5f9; color: #334155; padding: .4rem .8rem; border-radius: 8px; font-weight: 900; font-size: 1.1rem; letter-spacing: .05em; margin: 0 auto .5rem; text-transform: uppercase; box-shadow: inset 0 2px 4px rgba(0,0,0,.05);} .hint-box.show { display: inline-block; animation: popIn .2s var(--ease); }
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:.55rem} .choices.c2{grid-template-columns:repeat(2,1fr)} .choices.c3{grid-template-columns:repeat(3,1fr)} .choices.c5{grid-template-columns:repeat(5,1fr)}
.choice{background:#f8fafc;border:3px solid var(--line);border-radius:14px;min-height:clamp(68px,10vh,110px);padding:.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-weight:800;font-size:clamp(1.35rem,3.4vw,2.3rem);color:var(--ink);font-family:Georgia,serif;line-height:1.05;position:relative;transition:all .14s;}
.choice.sans{font-family:var(--font);font-size:clamp(1rem,2vw,1.45rem)}
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue);background:#fff;box-shadow:var(--sh)}
.choice .key-hint{position:absolute;top:4px;left:6px;font-family:var(--font);font-size:.58rem;font-weight:900;padding:.08rem .32rem;border-radius:5px;background:#e2e8f0;color:var(--ink2)}
.choice.correct{border-color:var(--green)!important;background:var(--green-l)!important;color:var(--green-d)!important}
.choice.wrong{border-color:var(--red)!important;background:var(--red-l)!important;color:var(--red)!important;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.steal-banner{display:none;margin:.4rem auto;padding:.5rem .9rem;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-weight:900;font-size:.82rem} .steal-banner.on{display:block;animation:popIn .3s}
.feedback{margin-top:.55rem;padding:.6rem .85rem;border-radius:11px;font-weight:800;font-size:.84rem;display:none;text-align:center} .feedback.on{display:block} .feedback.ok{background:var(--green-l);color:var(--green-d)} .feedback.no{background:var(--amber-l);color:var(--amber-d)} .feedback.steal{background:var(--blue-l);color:var(--blue-d)}
.mystery-overlay{margin-top:.7rem;padding:.8rem;border-radius:16px;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;display:none} .mystery-overlay.on{display:block;animation:fadeIn .25s}
.mystery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-top:.5rem;max-width:480px;margin-left:auto;margin-right:auto}
.m-box{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:.65rem .3rem;font-weight:900;font-size:.95rem;color:var(--gold);transition:all .15s} .m-box:hover:not(:disabled){transform:scale(1.05);background:rgba(255,255,255,.24);border-color:var(--gold)}
.teacher-row{display:flex;justify-content:center;gap:.45rem;margin-top:.65rem;flex-wrap:wrap} .t-btn{padding:.42rem .8rem;border-radius:9px;background:#fff;color:var(--ink2);font-weight:800;font-size:.74rem;box-shadow:var(--sh);border:1.5px solid var(--line)}
.next-btn{display:none;margin:.65rem auto 0;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:900;font-size:.88rem;padding:.65rem 1.5rem;border-radius:11px;box-shadow:0 4px 12px rgba(37,99,235,.3)} .next-btn.on{display:inline-flex;align-items:center;gap:.35rem}

  if(!soundOn) return;

    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const tone = (freq, start, dur, wave='sine', gain=0.12) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = wave; o.frequency.setValueAtTime(freq, now + start);
      g.gain.setValueAtTime(gain, now + start); g.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
      o.connect(g); g.connect(audioCtx.destination); o.start(now + start); o.stop(now + start + dur);
    };
    if(type==='ok'){tone(523.25,0,0.12,'triangle');tone(659.25,0.09,0.14,'triangle');tone(783.99,0.18,0.22,'triangle');}
    else if(type==='no'){tone(220,0,0.16,'sawtooth',0.09);tone(175,0.12,0.22,'sawtooth',0.09);}

  }catch(e){}
}

/* ---------- 4. POOL & DISTRACTOR HELPERS ---------- */
function activeLetterChars(){ return [...state.selectedLetters].sort(); }
function activeLetters(){ return activeLetterChars().map(c => LMAP[c]).filter(Boolean); }
function activeNumbers(){ return [...state.selectedNumbers].sort((a,b)=>a-b); }
function canPlayLetters(){ return state.selectedLetters.size >= 2; }
function canPlayNumbers(){ return state.selectedNumbers.size >= 2; }
function optionCount(){ 
  return Math.min(state.difficulty === 'easy' ? 3 : state.difficulty === 'hard' ? 5 : 4, Math.max(activeLetterChars().length, 3), Math.max(activeNumbers().length, 3)); 
}
function pickWord(L){ const valid = L.words.filter(x => !x.end); return rand(valid.length ? valid : L.words); }

function letterDistractors(target, n){
  const pool = activeLetterChars().filter(c => c !== target);
  const fullPool = shuffle(LETTERS.map(L=>L.c).filter(c => c !== target));
  const confusable = (CONFUSE[target]||[]).filter(c => pool.includes(c));
  const out = [];
  for(const c of shuffle(confusable)){ if(out.length < n && !out.includes(c)) out.push(c); }
  for(const c of shuffle(pool)){ if(out.length < n && !out.includes(c)) out.push(c); }
  for(const c of fullPool){ if(out.length < n && !out.includes(c)) out.push(c); }
  return out.slice(0, n);
}

function numberDistractors(target, count){
  const pool = activeNumbers().filter(n => n !== target);
  const max = Math.max(...activeNumbers(), target, 10);
  const out = [];
  const traps = [];
  const s = String(target);
  if(s.length === 2){ const rev = parseInt(s[1] + s[0], 10); if(rev !== target) traps.push(rev); }
  const teenPair = {13:30,30:13,14:40,40:14,15:50,50:15,16:60,60:16,17:70,70:17,18:80,80:18,19:90,90:19,6:9,9:6};
  if(teenPair[target] != null) traps.push(teenPair[target]);
  [1,-1,2,-2,10,-10,5,-5].forEach(d => { if(target+d >= 0 && target+d <= 100) traps.push(target+d); });
  for(const c of shuffle(traps)){ if(out.length < count && !out.includes(c) && c !== target) out.push(c); }
  for(const c of shuffle(pool)){ if(out.length < count && !out.includes(c)) out.push(c); }
  let safety = 0;
  while(out.length < count && safety++ < 200){
    const v = rndInt(0, max); if(v !== target && !out.includes(v)) out.push(v);
  }
  return out.slice(0, count);
}

      return { sig:`mem-${items.join('')}-${posIdx}`, target: ans, prompt:`Look fast! Which item is <b>${posName}</b> in the row?`, display:`<div class="seq memory-seq">${items.map(x=>`<span>${x}</span>`).join('')}</div>`, choices: shuffle(opts).map(x => ({label:x, html:x, correct:x===ans})), isMemoryFlash: true, ok:`Great memory! The order was <b>${items.join(' · ')}</b>.`, no:`The order was <b>${items.join(' · ')}</b> (${posName}: <b>${ans}</b>).` };
    }
  }
];

function generateUniqueQ(gameId, avoidSig='', avoidTarget=null){
  const g = GAMES.find(x => x.id === gameId) || GAMES[0];
  let q = null, bestFallbackQ = null;
  for(let i = 0; i < 40; i++){
    q = g.generate(); bestFallbackQ = q; 
    if(q.sig !== avoidSig && q.target !== avoidTarget && !state.recentSigs.includes(q.sig) && !state.recentTargets.includes(q.target)) break;
  }
  if(q.sig === avoidSig || q.target === avoidTarget || state.recentSigs.includes(q.sig) || state.recentTargets.includes(q.target)){
    for(let i = 0; i < 30; i++){
       q = g.generate(); bestFallbackQ = q;
       if(q.sig !== avoidSig && q.target !== avoidTarget) break;
    }
  }
  q = bestFallbackQ;
  if(q && q.sig){
    state.recentSigs.push(q.sig); if(state.recentSigs.length > 12) state.recentSigs.shift();
    if(q.target !== undefined) { state.recentTargets.push(q.target); if(state.recentTargets.length > 10) state.recentTargets.shift(); }
  }
  return q;
}

function handleSplitAnswer(pNum, idx){
  if(state.paused) return; if(pNum === 1 && state.p1Done) return; if(pNum === 2 && state.p2Done) return;
  const isP1 = pNum === 1, q = isP1 ? state.q1 : state.q2, p = isP1 ? state.p1 : state.p2, otherDone = isP1 ? state.p2Done : state.p1Done;
  if(isP1) state.p1Done = true; else state.p2Done = true;
  const correctIdx = q.choices.findIndex(c => c.correct), isOk = idx === correctIdx, btns = $(isP1 ? 'choices1' : 'choices2').querySelectorAll('.choice');
  btns.forEach((b, i) => { b.disabled = true; if(i === correctIdx) b.classList.add('correct'); if(i === idx && !isOk) b.classList.add('wrong'); });
  $(isP1 ? 'pane1' : 'pane2').querySelectorAll('.blur-target').forEach(el => el.classList.add('revealed'));
  const fb = $(isP1 ? 'fb1' : 'fb2'), st = $(isP1 ? 'status1' : 'status2'); p.total++;
  if(isOk){
    sfx('ok'); const speedBonus = !otherDone ? 2 : 0, pts = 10 + speedBonus; p.score += pts; p.correct++; p.streak++; p.best = Math.max(p.best, p.streak); popScore(pNum);
    st.textContent = speedBonus ? '⚡ First! +12' : '✓ Correct +10'; fb.className = 'feedback on ok'; fb.innerHTML = `${speedBonus?'⚡ Speed Bonus! ':''}${q.ok}`;
  } else { sfx('no'); p.streak = 0; st.textContent = '✗ Missed'; fb.className = 'feedback on no'; fb.innerHTML = q.no; }

}

function loadTugQuestion(pNum){
  const isP1 = pNum === 1, otherQ = isP1 ? state.q2 : state.q1, q = generateUniqueQ(state.gameId, otherQ ? otherQ.sig : '', otherQ ? otherQ.target : null);
  if(isP1) state.q1 = q; else state.q2 = q;
  $(isP1 ? 'pr1' : 'pr2').innerHTML = q.prompt; $(isP1 ? 'disp1' : 'disp2').innerHTML = q.display;
  $(isP1 ? 'actions1' : 'actions2').innerHTML = `<div class="action-row">${q.speakOnLoad ? `<button class="listen-btn" id="tugListen${pNum}">🔊 Listen</button>` : ''} ${q.hint ? `<button class="hint-btn" id="tugHintBtn${pNum}">👀 Show Word</button>` : ''}</div>${q.hint ? `<div class="hint-box" id="tugHintBox${pNum}">${q.hint}</div>` : ''}`;
  if($(`tugListen${pNum}`)) $(`tugListen${pNum}`).onclick = () => speak(q.speakOnLoad); if($(`tugHintBtn${pNum}`)) $(`tugHintBtn${pNum}`).onclick = () => $(`tugHintBox${pNum}`).classList.toggle('show');
  const wrap = $(isP1 ? 'choices1' : 'choices2'), keys = isP1 ? ['A','S','D','F','G'] : ['H','J','K','L',';']; wrap.className = `choices ${q.choicesCls||''}`; wrap.innerHTML = '';
  q.choices.forEach((c, i) => { const b = document.createElement('button'); b.className = 'choice'; b.innerHTML = `<span class="key-hint">${keys[i]||''}</span>${c.html}`; b.onclick = () => handleTugAnswer(pNum, i); wrap.appendChild(b); });
}

function handleTugAnswer(pNum, idx){
  if(state.paused || state.locked) return; if(pNum === 1 && state.p1Frozen) return; if(pNum === 2 && state.p2Frozen) return;
  const isP1 = pNum === 1, q = isP1 ? state.q1 : state.q2, p = isP1 ? state.p1 : state.p2, correctIdx = q.choices.findIndex(c => c.correct); p.total++;
  if(idx === correctIdx){
    sfx('ok'); p.score += 10; p.correct++; p.streak++; p.best = Math.max(p.best, p.streak); state.ropePos += isP1 ? -1 : 1; popScore(pNum); updateHUD();
    if(Math.abs(state.ropePos) >= 5){ state.locked = true; cleanupTimer(); confetti(60); setTimeout(() => showResult(), 700); return; }
    loadTugQuestion(pNum);
  } else {
    sfx('no'); p.streak = 0; updateHUD(); if(isP1) state.p1Frozen = true; else state.p2Frozen = true; const fr = $(isP1 ? 'freeze1' : 'freeze2'); if(fr) fr.classList.add('on');
    setTimeout(() => { if(isP1) state.p1Frozen = false; else state.p2Frozen = false; if(fr) fr.classList.remove('on'); loadTugQuestion(pNum); }, 1800);
  }
}

function renderTurnRound(isStealTurn=false){
  cleanupTimer(); state.phase = isStealTurn ? 'steal' : 'first'; state.locked = false;
  state.q = generateUniqueQ(state.gameId, state.q ? state.q.sig : '', state.q ? state.q.target : null);
  const activeP = (isStealTurn ? (state.turn===1?2:1) : state.turn), pObj = activeP === 1 ? state.p1 : state.p2, pColor = activeP === 1 ? 'var(--blue)' : 'var(--purple)';
  $('arenaContainer').innerHTML = `
    <div class="stage-single" id="singleStage">
      <div class="steal-banner ${isStealTurn?'on':''}" id="stealBanner">⚡ SMART STEAL CHANCE for <b>${pObj.name}</b>!</div>
      <div style="font-weight:900;color:${pColor};font-size:.82rem;text-transform:uppercase;margin-bottom:.35rem">${pObj.icon} ${pObj.name}'s ${isStealTurn ? 'Steal Attempt' : 'Turn'}</div>
      <div class="q-prompt">${state.q.prompt}</div><div class="q-display">${state.q.display}</div>
      <div class="action-row">${state.q.speakOnLoad ? `<button class="listen-btn" id="listenSingle">🔊 Listen Again</button>` : ''} ${state.q.hint ? `<button class="hint-btn" id="hintBtnSingle">👀 Show Word</button>` : ''}</div>${state.q.hint ? `<div class="hint-box" id="hintBoxSingle">${state.q.hint}</div>` : ''}
      <div class="choices ${state.q.choicesCls||''}" id="choicesSingle"></div><div class="feedback" id="fbSingle"></div>
      <div class="mystery-overlay" id="mysteryOverlay"><div>🎁 <b>${pObj.name}</b>, pick a Mystery Chest!</div><div class="mystery-grid" id="mysteryGrid"></div></div>
      <button class="next-btn" id="nextBtn">Next Round →</button>
    </div>
  `;
  state.q.choices.forEach((c, i) => { const b = document.createElement('button'); b.className = 'choice'; b.innerHTML = `<span class="key-hint">${i+1}</span>${c.html}`; b.onclick = () => handleTurnAnswer(i); $('choicesSingle').appendChild(b); });
  if($('listenSingle')) $('listenSingle').onclick = () => speak(state.q.speakOnLoad); if($('hintBtnSingle')) $('hintBtnSingle').onclick = () => $('hintBoxSingle').classList.toggle('show');
  if(state.q.speakOnLoad) setTimeout(() => speak(state.q.speakOnLoad), 250); $('nextBtn').onclick = () => advanceRound(); applyMemoryFlashIfNeeded($('singleStage'), state.q);
  if(state.timerOn) startRoundTimer(() => handleTurnAnswer(-1));
}

function handleTurnAnswer(idx){
  if(state.locked || state.paused) return; state.locked = true; cleanupTimer();
  const isSteal = state.phase === 'steal', activeP = isSteal ? (state.turn===1?2:1) : state.turn, p = activeP === 1 ? state.p1 : state.p2, correctIdx = state.q.choices.findIndex(c => c.correct), isOk = idx === correctIdx, btns = $('choicesSingle').querySelectorAll('.choice');
  btns.forEach((b, i) => { b.disabled = true; if(i === correctIdx) b.classList.add('correct'); if(i === idx && !isOk) b.classList.add('wrong'); });
  $('singleStage').querySelectorAll('.blur-target').forEach(el => el.classList.add('revealed')); p.total++; const fb = $('fbSingle');
  if(isOk){
    sfx('ok'); p.score += 10; p.correct++; if(isSteal) p.steals++; else { p.streak++; p.best = Math.max(p.best, p.streak); } popScore(activeP); updateHUD();
    fb.className = 'feedback on ok'; fb.innerHTML = `🌟 <b>${p.name}</b> got it! (+10 pts) ${state.q.ok}`;
    if(state.battleMode === 'mystery') showMysteryChests(activeP); else $('nextBtn').classList.add('on');
  } else {
    sfx('no'); p.streak = 0; updateHUD();
    if(!isSteal){ fb.className = 'feedback on steal'; const otherName = state.turn === 1 ? state.p2.name : state.p1.name; fb.innerHTML = `${state.q.no} — Steal chance for <b>${otherName}</b>!`; setTimeout(() => { sfx('steal'); renderTurnRound(true); }, 1700); }
    else { fb.className = 'feedback on no'; fb.innerHTML = `No steal this time! ${state.q.no}`; $('nextBtn').classList.add('on'); }
  }
}

function showMysteryChests(winnerNum){
  $('mysteryOverlay').classList.add('on');
  const rewards = shuffle([
    {t:'💎 +20 pts', fn:(p)=>p.score+=20},{t:'⭐ +15 pts', fn:(p)=>p.score+=15},{t:'🪙 +10 pts', fn:(p)=>p.score+=10},{t:'⚡ Double Score!', fn:(p)=>p.score*=2},{t:'🧲 Steal 10 pts!', fn:(p,o)=>{ const s=Math.min(10,o.score); o.score-=s; p.score+=s; }},{t:'🔄 Swap Scores!', fn:(p,o)=>{ const t=p.score; p.score=o.score; o.score=t; }},{t:'🎁 Gift +5 to Both', fn:(p,o)=>{ p.score+=5; o.score+=5; }},{t:'💣 Boom! -5 pts', fn:(p)=>p.score=Math.max(0,p.score-5)}
  ]);
  rewards.forEach((r, i) => {
    const b = document.createElement('button'); b.className = 'm-box'; b.textContent = `📦 Chest ${i+1}`;
    b.onclick = () => {
      sfx('win'); const p = winnerNum === 1 ? state.p1 : state.p2, o = winnerNum === 1 ? state.p2 : state.p1; r.fn(p, o); b.textContent = r.t;
      $('mysteryGrid').querySelectorAll('.m-box').forEach(x => x.disabled = true); updateHUD(); popScore(1); popScore(2); $('nextBtn').classList.add('on');
    };
    $('mysteryGrid').appendChild(b);
  });
}

function startRoundTimer(onExpire, customSecs){
  cleanupTimer(); const total = customSecs || state.timerSeconds; state.timeLeft = total; if($('timerRow')) $('timerRow').classList.add('on');
  const startTs = performance.now(), tick = (now) => {
    if(state.paused){ state.timerId = requestAnimationFrame(tick); return; }
    const elapsed = (now - startTs) / 1000, rem = Math.max(0, total - elapsed); state.timeLeft = rem;
    if($('timerCount'))$('timerCount').textContent = `${Math.ceil(rem)}s`; if($('timerFill'))$('timerFill').style.width = `${(rem / total) * 100}%`;
    if(rem <= 0){ cleanupTimer(); onExpire(); return; } state.timerId = requestAnimationFrame(tick);
  };
  state.timerId = requestAnimationFrame(tick);
}

function cleanupTimer(){ if(state.timerId){ cancelAnimationFrame(state.timerId); state.timerId = null; } if($('timerRow'))$('timerRow').classList.remove('on'); }

window.addEventListener('keydown', e => {
  if(state.paused || !state.gameId) return; const k = e.key.toUpperCase();
  if(state.battleMode === 'split' || state.battleMode === 'tug'){
    const p1Idx = ['A','S','D','F','G'].indexOf(k), p2Idx = ['H','J','K','L',';'].indexOf(k);
    if(p1Idx !== -1 && state.q1 && p1Idx < state.q1.choices.length) state.battleMode === 'tug' ? handleTugAnswer(1, p1Idx) : handleSplitAnswer(1, p1Idx);
    if(p2Idx !== -1 && state.q2 && p2Idx < state.q2.choices.length) state.battleMode === 'tug' ? handleTugAnswer(2, p2Idx) : handleSplitAnswer(2, p2Idx);
  } else { const idx = ['1','2','3','4','5'].indexOf(k); if(idx !== -1 && state.q && idx < state.q.choices.length) handleTurnAnswer(idx); }
});

function showResult(){
  cleanupTimer(); state.gameId = null; sfx('win'); confetti(75);
  const p1 = state.p1, p2 = state.p2; let cls = 'tie', title = "🤝 It's a Tie!";
  if(p1.score > p2.score){ cls = 'p1win'; title = `👑 ${p1.name} Wins the Championship!`; } else if(p2.score > p1.score){ cls = 'p2win'; title = `👑 ${p2.name} Wins the Championship!`; }
  const p1Acc = p1.total ? Math.round((p1.correct/p1.total)*100) : 0, p2Acc = p2.total ? Math.round((p2.correct/p2.total)*100) : 0;
  $('app').innerHTML = `<section class="screen on"><div class="result-screen ${cls}"><div style="font-size:3.6rem">🏆</div><h1 style="font-size:clamp(1.4rem,3.4vw,2.2rem);margin:.3rem 0">${title}</h1><div class="final"><div class="side"><div>${p1.icon} ${p1.name}</div><div class="val">${p1.score}</div><small>${p1.correct}/${p1.total} (${p1Acc}%)</small></div><div style="font-weight:900">VS</div><div class="side"><div>${p2.icon} ${p2.name}</div><div class="val">${p2.score}</div><small>${p2.correct}/${p2.total} (${p2Acc}%)</small></div></div><p style="font-weight:700;margin-bottom:1rem">🔥 Best Streaks — ${p1.name}: ${p1.best} · ${p2.name}: ${p2.best}</p><div><button class="btn" id="homeResBtn">🏠 Choose Another Game</button></div></div></section>`;
  $('homeResBtn').onclick = () => renderHome();
}

$('resumeBtn').onclick = () => { state.paused = false; $('pauseOverlay').classList.remove('on'); };
$('homeBtn').onclick = () => { cleanupTimer(); state.gameId = null; renderHome(); };
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').classList.toggle('on', soundOn); $('soundBtn').textContent = soundOn ? '🔊 Sound' : '🔇 Muted'; if(!soundOn && speechOK) window.speechSynthesis.cancel(); };

renderHome();
</script>

</body></html>
