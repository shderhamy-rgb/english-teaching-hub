<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Handwriting &amp; Phonics Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(145deg, #e0f2fe 0%, #f0fdf4 50%, #fef9c3 100%);
            min-height: 100dvh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .persian-text {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            direction: rtl;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .ltr-anchor-pulse {
            animation: gentlePulse 2s infinite ease-in-out;
            transform-box: fill-box;
            transform-origin: center;
        }
        @keyframes activeBadgeBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.22); }
        }
        .active-start-badge {
            animation: activeBadgeBounce 0.85s infinite ease-in-out;
            transform-box: fill-box;
            transform-origin: center;
        }
        @keyframes speakerWave {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
        }
        .speaking-pulse { animation: speakerWave 1s infinite ease-in-out; }

        @keyframes recDotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(0.85); }
        }
        .rec-blink { animation: recDotBlink 0.8s infinite ease-in-out; }
    </style>

<body class="flex flex-col justify-between p-2 sm:p-4 max-w-4xl mx-auto min-h-[100dvh]">

    <!-- 1. TOP HEADER: CHARACTER BAR & TEACHER CONTROLS -->
    <header class="w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-md border-2 border-sky-100 p-2 sm:p-2.5 flex flex-col gap-2">

        <!-- TEACHER TOOLBAR (Automatically removed in exported Student HTML) -->
        

        <!-- Scrollable Character Pill Bar -->
        <div id="charBar" class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar py-1 px-1 scroll-smooth"></div>

        <!-- TEACHER VOICE STUDIO DRAWER (Automatically removed in exported Student HTML) -->
        
    </header>

    <!-- HOMEWORK SELECTOR MODAL (Automatically removed in exported Student HTML) -->
    

    <!-- 2. CENTER 4-LINE NOTEBOOK STAGE -->
    <main class="flex-1 flex flex-col justify-center my-2">
        <div class="bg-white rounded-[2rem] shadow-2xl border-4 border-sky-200 overflow-hidden relative flex flex-col">

            <!-- Stage Header: Word Speaker + Mode Switcher + Stroke Order Legend -->
            <div class="flex flex-wrap items-center justify-between gap-2 px-3 sm:px-5 py-2 bg-slate-50 border-b-2 border-slate-100">
                
                <!-- Left: Word + Emoji Audio Pill -->
                <div class="flex items-center gap-2">
                    <button id="wordSpeakerPill" onclick="speakCurrentChar()" class="flex items-center gap-2 bg-amber-100 hover:bg-amber-200 active:scale-95 text-amber-950 px-3.5 py-1.5 rounded-2xl border-2 border-amber-300 shadow-sm transition cursor-pointer" title="Listen to pronunciation">
                        <span id="headerEmoji" class="text-2xl sm:text-3xl leading-none">🐙</span>
                        <span id="headerWord" class="text-base sm:text-xl font-bold tracking-wide">octopus</span>
                        <span class="text-base sm:text-lg">🔊</span>
                        <span id="customVoicePillTag" class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full uppercase tracking-wider font-extrabold">Teacher</span>
                    </button>
                </div>

                <!-- Center: Interactive Mode Switcher (Watch / Trace / Freehand) + Ghost Toggle -->
                <div class="flex items-center gap-1.5">
                    <div class="flex items-center bg-slate-200/80 p-1 rounded-2xl gap-1">
                        <button id="modeBtn-watch" onclick="setInteractionMode('watch')" class="px-2.5 sm:px-3 py-1 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer bg-sky-500 text-white shadow-sm">
                            👀 Watch
                        </button>
                        <button id="modeBtn-trace" onclick="setInteractionMode('trace')" class="px-2.5 sm:px-3 py-1 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer text-slate-700 hover:text-slate-950">
                            ✍️ Trace
                        </button>
                        <button id="modeBtn-freehand" onclick="setInteractionMode('freehand')" class="px-2.5 sm:px-3 py-1 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer text-slate-700 hover:text-slate-950">
                            📝 Write
                        </button>
                    </div>

                    <button id="toggleGhostBtn" onclick="toggleGhostTrack()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold border transition cursor-pointer bg-sky-100 text-sky-900 border-sky-300" title="Toggle Ghost Guide">
                        Guide: ON
                    </button>

                    <button id="clearBoardBtn" onclick="clearFreehandBoard()" class="hidden px-2.5 py-1.5 rounded-xl text-xs font-bold bg-rose-100 hover:bg-rose-200 text-rose-800 border border-rose-300 transition cursor-pointer">
                        🧹 Clear
                    </button>
                </div>

                <!-- Right: Stroke Order Legend -->
                <div id="strokeLegend" class="flex items-center gap-1 overflow-x-auto max-w-[180px] no-scrollbar"></div>
            </div>

            <!-- THE 4-LINE NOTEBOOK CANVAS (ViewBox 640 x 400) -->
            <div class="relative w-full aspect-[16/10] bg-white select-none overflow-hidden">
                <svg id="notebookSvg" viewBox="0 0 640 400" class="w-full h-full block touch-none">
                    <defs>
                        <filter id="penContactShadow" x="-30%" y="-30%" width="180%" height="180%">
                            <feDropShadow dx="3" dy="4" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.32"></feDropShadow>
                        </filter>
                        <filter id="penLiftedShadow" x="-50%" y="-50%" width="220%" height="220%">
                            <feDropShadow dx="14" dy="18" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"></feDropShadow>
                        </filter>
                    </defs>

                    <!-- Paper Background -->
                    <rect x="0" y="0" width="640" height="400" fill="#ffffff"></rect>
                    <rect x="0" y="70" width="640" height="200" fill="#f8fafc" opacity="0.55"></rect>

                    <!-- Left Red Vertical Notebook Margin Line -->
                    <line x1="84" y1="0" x2="84" y2="400" stroke="#fda4af" stroke-width="3"></line>
                    <line x1="89" y1="0" x2="89" y2="400" stroke="#fecdd3" stroke-width="1.5"></line>

                    <!-- 4-LINE PRIMARY NOTEBOOK GRID -->
                    <!-- Line 1: Top Line (Pink/Red) Y = 70 -->
                    <line x1="0" y1="70" x2="640" y2="70" stroke="#f43f5e" stroke-width="3.5"></line>
                    <circle cx="24" cy="70" r="13" fill="#ffe4e6"></circle>
                    <text x="24" y="75" text-anchor="middle" fill="#e11d48" font-size="15" font-weight="bold">1</text>

                    <!-- Line 2: Midline (Dashed Sky Blue) Y = 170 -->
                    <line x1="0" y1="170" x2="640" y2="170" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="14,10"></line>
                    <circle cx="24" cy="170" r="13" fill="#e0f2fe"></circle>
                    <text x="24" y="175" text-anchor="middle" fill="#0284c7" font-size="15" font-weight="bold">2</text>

                    <!-- Line 3: Baseline (Solid Bold Navy Blue) Y = 270 -->
                    <line x1="0" y1="270" x2="640" y2="270" stroke="#1e293b" stroke-width="4.5"></line>
                    <circle cx="24" cy="270" r="13" fill="#e2e8f0"></circle>
                    <text x="24" y="275" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="bold">3</text>

                    <!-- Line 4: Bottom Descender Line (Light Pink) Y = 350 -->
                    <line x1="0" y1="350" x2="640" y2="350" stroke="#fda4af" stroke-width="2.5"></line>
                    <circle cx="24" cy="350" r="13" fill="#fff1f2"></circle>
                    <text x="24" y="355" text-anchor="middle" fill="#fb7185" font-size="15" font-weight="bold">4</text>

                    <!-- GREEN LEFT-TO-RIGHT STARTING COMPASS -->
                    <g transform="translate(56, 120)">
                        <circle cx="0" cy="0" r="18" fill="#16a34a" class="ltr-anchor-pulse"></circle>
                        <path d="M -7 0 L 6 0 M 1 -5 L 7 0 L 1 5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
                    </g>

                    <!-- Practice Board Divider (Visible only in Freehand Write Mode) -->
                    <line id="freehandDivider" x1="295" y1="40" x2="295" y2="370" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="8,8" class="hidden"></line>

                    <!-- GROUP WRAPPER FOR CHARACTER LAYERS -->
                    <g id="characterStageGroup" transform="translate(0, 0) scale(1)">
                        <g id="ghostLayer"></g>
                        <g id="chevronLayer"></g>
                        <g id="airPathLayer"></g>
                        <g id="inkLayer"></g>
                        <g id="badgeLayer"></g>
                    </g>

                    <!-- Student Freehand Drawing Layer -->
                    <g id="studentDrawLayer"></g>

                    <!-- Active Trace Target Ring -->
                    <circle id="traceTargetCursor" cx="235" cy="170" r="22" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="3" stroke-dasharray="5,5" class="hidden" style="pointer-events: none;"></circle>

                    <!-- Custom 3D-Style SVG Pencil -->
                    <g id="pencilCursor" visibility="hidden" filter="url(#penContactShadow)" style="pointer-events: none;" transform="translate(320.00006103515625, 170) scale(1)">
                        <g id="pencilBody" transform="rotate(45)">
                            <polygon points="0,0 -5.5,-14 5.5,-14" fill="#1e293b"></polygon>
                            <polygon points="-5.5,-14 5.5,-14 12,-32 -12,-32" fill="#fde68a" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"></polygon>
                            <path d="M -12 -32 Q -6 -28 0 -32 Q 6 -28 12 -32 L 12 -112 L -12 -112 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"></path>
                            <rect x="-4.5" y="-112" width="9" height="80" fill="#fbbf24"></rect>
                            <rect x="-12" y="-128" width="24" height="16" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"></rect>
                            <line x1="-12" y1="-123" x2="12" y2="-123" stroke="#94a3b8" stroke-width="1.5"></line>
                            <line x1="-12" y1="-117" x2="12" y2="-117" stroke="#94a3b8" stroke-width="1.5"></line>
                            <path d="M -12 -128 L -12 -144 C -12 -154, 12 -154, 12 -144 L 12 -128 Z" fill="#fb7185" stroke="#e11d48" stroke-width="1.5"></path>
                        </g>
                    </g>
                </svg>
            </div>
        </div>
    </main>

    <!-- 3. STREAMLINED 6-BUTTON BOTTOM CONTROL BAR -->
    <footer class="w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-lg border-2 border-sky-100 p-2 sm:p-3">
        <div class="grid grid-cols-6 gap-2 sm:gap-3 items-center">

            <button onclick="prevCharacter()" class="flex items-center justify-center h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold text-2xl sm:text-3xl shadow-sm border-b-4 border-slate-300 transition cursor-pointer" title="Previous (Left Arrow)">
                ◀
            </button>

            <button onclick="replayCurrent()" class="flex items-center justify-center h-14 sm:h-16 rounded-2xl bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-bold text-2xl sm:text-3xl shadow-md border-b-4 border-sky-700 transition cursor-pointer" title="Replay / Reset (Spacebar)">
                🔄
            </button>

            <button onclick="toggleAutoLoop()" id="loopBtn" class="flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold shadow-md border-b-4 border-emerald-700 transition cursor-pointer" title="Turn Continuous Auto-Loop On/Off">
                <span class="text-xl sm:text-2xl leading-none">🔁</span>
                <span id="loopLabel" class="text-[10px] sm:text-xs uppercase tracking-wider mt-0.5">Loop ON</span>
            </button>

            <button onclick="toggleSpeed()" id="speedBtn" class="flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl bg-amber-100 hover:bg-amber-200 active:scale-95 text-amber-900 font-bold shadow-sm border-b-4 border-amber-300 transition cursor-pointer" title="Switch between Slow (Turtle) and Fast (Rabbit) speeds">
                <span id="speedIcon" class="text-xl sm:text-2xl leading-none">🐢</span>
                <span id="speedLabel" class="text-[10px] sm:text-xs uppercase tracking-wider mt-0.5">Slow</span>
            </button>

            <button id="bottomSpeakBtn" onclick="speakCurrentChar()" class="flex items-center justify-center h-14 sm:h-16 rounded-2xl bg-purple-100 hover:bg-purple-200 active:scale-95 text-purple-900 font-bold text-2xl sm:text-3xl shadow-sm border-b-4 border-purple-300 transition cursor-pointer" title="Speak Aloud">
                🔊
            </button>

            <button onclick="nextCharacter()" class="flex items-center justify-center h-14 sm:h-16 rounded-2xl bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-2xl sm:text-3xl shadow-md border-b-4 border-emerald-700 transition cursor-pointer" title="Next (Right Arrow)">
                ▶
            </button>

        </div>
    </footer>

    <script>
        // ============================================================================

        function transformSvgPathX(pathStr, targetCenterX, scaleX = 1) {
            let isX = true;
            return pathStr.replace(/-?\d+(\.\d+)?/g, (match) => {

            return o === 0 ? tens[t] : `${tens[t]}-${ones[o]}`;

                activeList = CURRICULUM_DB.filter(it => it.type === 'upper');

                activeList = CURRICULUM_DB.filter(it => it.type === 'lower');

                activeList = CURRICULUM_DB.filter(it => it.type === 'number' && it.numVal >= 0 && it.numVal <= 10);

        function toggleHomeworkModal() {
            const modal = document.getElementById('homeworkModal');
            if (!modal) return;
            const isHidden = modal.classList.contains('hidden');
            if (isHidden) {
                renderHomeworkModalGrids();
                modal.classList.remove('hidden');
                modal.classList.add('flex');

        function renderHomeworkModalGrids() {
            const letterGrid = document.getElementById('hwGridLetters');
            const numGrid = document.getElementById('hwGridNumbers');
            if (!letterGrid || !numGrid) return;
            letterGrid.innerHTML = '';
            numGrid.innerHTML = '';

            CURRICULUM_DB.forEach(item => {
                const isSelected = homeworkSet.has(item.id);
                const btn = document.createElement('button');
                btn.onclick = () => {
                    if (homeworkSet.has(item.id)) homeworkSet.delete(item.id);
                    else homeworkSet.add(item.id);
                    renderHomeworkModalGrids();
                    updateHomeworkBadges();
                    renderCharBar();
                };
                btn.className = isSelected
                    ? 'px-3 py-1.5 rounded-xl font-bold text-xs sm:text-sm bg-indigo-600 text-white border-b-2 border-indigo-800 shadow-sm cursor-pointer transition'
                    : 'px-3 py-1.5 rounded-xl font-bold text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 cursor-pointer transition';
                btn.textContent = item.label;

                if (item.type === 'number') numGrid.appendChild(btn);
                else letterGrid.appendChild(btn);
            });

        function batchSelectHw(mode) {
            if (mode === 'clear') homeworkSet.clear();
            else if (mode === 'starter') CURRICULUM_DB.filter(x => x.starter).forEach(x => homeworkSet.add(x.id));
            else if (mode === 'upper') CURRICULUM_DB.filter(x => x.type === 'upper').forEach(x => homeworkSet.add(x.id));
            else if (mode === 'lower') CURRICULUM_DB.filter(x => x.type === 'lower').forEach(x => homeworkSet.add(x.id));
            else if (mode === '0_10') CURRICULUM_DB.filter(x => x.type === 'number' && x.numVal <= 10).forEach(x => homeworkSet.add(x.id));
            else if (mode === '11_20') CURRICULUM_DB.filter(x => x.type === 'number' && x.numVal >= 11 && x.numVal <= 20).forEach(x => homeworkSet.add(x.id));
            else if (mode === 'tens') CURRICULUM_DB.filter(x => x.type === 'number' && x.numVal >= 10 && x.numVal % 10 === 0).forEach(x => homeworkSet.add(x.id));

            renderHomeworkModalGrids();
            updateHomeworkBadges();
            renderCharBar();
        }

        // 6. STAGE RENDERER & SVG GEOMETRY BUILDER
        // ============================================================================
        function selectCharacter(idx) {
            if (idx < 0 || idx >= activeList.length) return;
            currentIndex = idx;
            renderCharBar();
            updateHomeworkBadges();

            const pill = document.getElementById(`pill-${idx}`);

            document.getElementById('customVoicePillTag').classList.toggle('hidden', !hasCustomVoice);

            updateStudioUIForCurrentChar();
            buildCharacterSvgLayers(item);
            clearFreehandBoard();
            applyInteractionModeSetup();
        }

        function buildCharacterSvgLayers(item) {
            const ghostLayer = document.getElementById('ghostLayer');
            const chevronLayer = document.getElementById('chevronLayer');
            const airPathLayer = document.getElementById('airPathLayer');
            const inkLayer = document.getElementById('inkLayer');
            const badgeLayer = document.getElementById('badgeLayer');
            const legend = document.getElementById('strokeLegend');

            ghostLayer.innerHTML = '';
            chevronLayer.innerHTML = '';
            airPathLayer.innerHTML = '';
            inkLayer.innerHTML = '';
            badgeLayer.innerHTML = '';
            legend.innerHTML = '';
            computedStrokes = [];

            const isMulti = item.label.length >= 3;
            const ghostWidth = isMulti ? '26' : '34';
            const inkWidth = isMulti ? '20' : '26';

            item.strokes.forEach((dStr, sIdx) => {
                const color = STROKE_COLORS[sIdx % STROKE_COLORS.length];

                // 1. Ghost Track
                const ghostPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                ghostPath.setAttribute('d', dStr);
                ghostPath.setAttribute('fill', 'none');
                ghostPath.setAttribute('stroke', '#e2e8f0');
                ghostPath.setAttribute('stroke-width', ghostWidth);
                ghostPath.setAttribute('stroke-linecap', 'round');
                ghostPath.setAttribute('stroke-linejoin', 'round');
                ghostLayer.appendChild(ghostPath);

                // 2. Dashed Centerline
                const centerDash = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                centerDash.setAttribute('d', dStr);
                centerDash.setAttribute('fill', 'none');
                centerDash.setAttribute('stroke', '#94a3b8');
                centerDash.setAttribute('stroke-width', '3');
                centerDash.setAttribute('stroke-dasharray', '6,8');
                centerDash.setAttribute('stroke-linecap', 'round');
                centerDash.setAttribute('stroke-linejoin', 'round');
                chevronLayer.appendChild(centerDash);

                // 3. Active Ink Stroke
                const inkPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                inkPath.setAttribute('id', `ink-stroke-${sIdx}`);
                inkPath.setAttribute('d', dStr);
                inkPath.setAttribute('fill', 'none');
                inkPath.setAttribute('stroke', color);
                inkPath.setAttribute('stroke-width', inkWidth);
                inkPath.setAttribute('stroke-linecap', 'round');
                inkPath.setAttribute('stroke-linejoin', 'round');
                inkLayer.appendChild(inkPath);

                const totalLen = Math.max(1, inkPath.getTotalLength());
                inkPath.style.strokeDasharray = `${totalLen}px`;
                inkPath.style.strokeDashoffset = `${totalLen}px`;

                // Directional Chevrons (Only for strokes longer than 20px)
                if (totalLen > 20) {
                    const chevronFractions = totalLen > 120 ? [0.35, 0.7] : [0.5];
                    chevronFractions.forEach(frac => {
                        const dist = totalLen * frac;
                        const p1 = inkPath.getPointAtLength(Math.max(0, dist - 2));
                        const p2 = inkPath.getPointAtLength(Math.min(totalLen, dist + 2));
                        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI);

                        const chev = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        chev.setAttribute('d', 'M -4 -5 L 3 0 L -4 5');
                        chev.setAttribute('fill', 'none');
                        chev.setAttribute('stroke', color);
                        chev.setAttribute('stroke-width', '3');
                        chev.setAttribute('stroke-linecap', 'round');
                        chev.setAttribute('stroke-linejoin', 'round');
                        chev.setAttribute('opacity', '0.7');
                        chev.setAttribute('transform', `translate(${p1.x}, ${p1.y}) rotate(${angle})`);
                        chevronLayer.appendChild(chev);
                    });
                }

                // 4. Start Badge
                const startPt = inkPath.getPointAtLength(0);
                const nextPt = inkPath.getPointAtLength(Math.min(totalLen, 8));
                const startAngle = Math.atan2(nextPt.y - startPt.y, nextPt.x - startPt.x) * (180 / Math.PI);
                const endPt = inkPath.getPointAtLength(totalLen);

                const badgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                badgeG.setAttribute('id', `start-badge-${sIdx}`);

                if (totalLen > 15) {
                    const dirArrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    dirArrow.setAttribute('d', 'M 12 0 L 26 0 M 21 -5 L 27 0 L 21 5');
                    dirArrow.setAttribute('fill', 'none');
                    dirArrow.setAttribute('stroke', color);
                    dirArrow.setAttribute('stroke-width', '3.5');
                    dirArrow.setAttribute('stroke-linecap', 'round');
                    dirArrow.setAttribute('stroke-linejoin', 'round');
                    dirArrow.setAttribute('transform', `translate(${startPt.x}, ${startPt.y}) rotate(${startAngle})`);
                    badgeG.appendChild(dirArrow);
                }

                const badgeCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                badgeCircle.setAttribute('cx', startPt.x);
                badgeCircle.setAttribute('cy', startPt.y);
                badgeCircle.setAttribute('r', isMulti ? '12' : '14');
                badgeCircle.setAttribute('fill', color);
                badgeCircle.setAttribute('stroke', '#ffffff');
                badgeCircle.setAttribute('stroke-width', '2.5');

                const badgeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                badgeText.setAttribute('x', startPt.x);
                badgeText.setAttribute('y', startPt.y + 4.5);
                badgeText.setAttribute('text-anchor', 'middle');
                badgeText.setAttribute('fill', '#ffffff');
                badgeText.setAttribute('font-size', isMulti ? '12' : '14');
                badgeText.setAttribute('font-weight', 'bold');
                badgeText.textContent = `${sIdx + 1}`;

                badgeG.appendChild(badgeCircle);
                badgeG.appendChild(badgeText);
                badgeLayer.appendChild(badgeG);

                computedStrokes.push({
                    pathEl: inkPath,
                    badgeEl: badgeG,
                    length: totalLen,
                    color,
                    startPt,
                    endPt
                });

                // 5. Stroke Legend Pill
                if (sIdx > 0) {
                    const arrowSpan = document.createElement('span');
                    arrowSpan.className = 'text-slate-300 font-bold text-[10px]';
                    arrowSpan.textContent = '→';
                    legend.appendChild(arrowSpan);
                }
                const legPill = document.createElement('div');
                legPill.id = `legend-pill-${sIdx}`;
                legPill.className = 'shrink-0 w-6 h-6 sm:w-7 sm:h-7 rounded-full font-bold text-xs flex items-center justify-center text-white border-2 border-white shadow-sm transition-transform opacity-80';
                legPill.style.backgroundColor = color;
                legPill.textContent = `${sIdx + 1}`;
                legend.appendChild(legPill);
            });
        }

        // ============================================================================
        // 7. 60FPS PENCIL ANIMATION ENGINE
        // ============================================================================
        function startWatchAnimation() {
            stopWatchAnimation();
            activeStrokeIdx = 0;
            animPhase = 'drawing';
            document.getElementById('airPathLayer').innerHTML = '';

            computedStrokes.forEach((st, idx) => {
                st.pathEl.style.strokeDashoffset = `${st.length}px`;
                st.badgeEl.classList.toggle('active-start-badge', idx === 0);
            });

            updateLegendHighlight(0);

            const pencil = document.getElementById('pencilCursor');
            pencil.setAttribute('visibility', 'visible');
            phaseTimestamp = performance.now();
            animReqId = requestAnimationFrame(stepAnimationFrame);
        }

        function stopWatchAnimation() {
            if (animReqId) {
                cancelAnimationFrame(animReqId);
                animReqId = null;
            }
            document.getElementById('pencilCursor').setAttribute('visibility', 'hidden');
            document.getElementById('airPathLayer').innerHTML = '';
            computedStrokes.forEach(st => st.badgeEl.classList.remove('active-start-badge'));
        }

        function stepAnimationFrame(now) {
            const dt = now - phaseTimestamp;
            const pencil = document.getElementById('pencilCursor');
            const currentStroke = computedStrokes[activeStrokeIdx];
            if (!currentStroke) return;

            if (animPhase === 'drawing') {
                const speedPxPerSec = isSlowSpeed ? 145 : 290;
                const durationMs = Math.max(380, (currentStroke.length / speedPxPerSec) * 1000);
                const t = Math.min(1, dt / durationMs);
                const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

                const curDist = currentStroke.length * eased;
                currentStroke.pathEl.style.strokeDashoffset = `${currentStroke.length - curDist}px`;

                const pt = currentStroke.pathEl.getPointAtLength(curDist);
                pencil.setAttribute('filter', 'url(#penContactShadow)');
                pencil.setAttribute('transform', `translate(${pt.x}, ${pt.y}) scale(1)`);

                if (t >= 1) {
                    currentStroke.badgeEl.classList.remove('active-start-badge');
                    if (activeStrokeIdx + 1 < computedStrokes.length) {
                        animPhase = 'lifting';
                        phaseTimestamp = now;
                        const prevEnd = computedStrokes[activeStrokeIdx].endPt;
                        const nextStart = computedStrokes[activeStrokeIdx + 1].startPt;
                        document.getElementById('airPathLayer').innerHTML = `<line x1="${prevEnd.x}" y1="${prevEnd.y}" x2="${nextStart.x}" y2="${nextStart.y}" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5,7" stroke-linecap="round" />`;
                    } else {
                        animPhase = 'pause_end';
                        phaseTimestamp = now;
                        pencil.setAttribute('visibility', 'hidden');
                    }
                }
            } else if (animPhase === 'lifting') {
                const liftDuration = isSlowSpeed ? 580 : 320;
                const t = Math.min(1, dt / liftDuration);
                const prevEnd = computedStrokes[activeStrokeIdx].endPt;
                const nextStart = computedStrokes[activeStrokeIdx + 1].startPt;

                const curX = prevEnd.x + (nextStart.x - prevEnd.x) * t;
                const curY = prevEnd.y + (nextStart.y - prevEnd.y) * t - Math.sin(t * Math.PI) * 26;
                const scale = 1 + Math.sin(t * Math.PI) * 0.15;

                pencil.setAttribute('filter', 'url(#penLiftedShadow)');
                pencil.setAttribute('transform', `translate(${curX}, ${curY}) scale(${scale})`);

                if (t >= 1) {
                    document.getElementById('airPathLayer').innerHTML = '';
                    activeStrokeIdx++;
                    computedStrokes[activeStrokeIdx].badgeEl.classList.add('active-start-badge');
                    updateLegendHighlight(activeStrokeIdx);
                    animPhase = 'drawing';
                    phaseTimestamp = now;
                }
            } else if (animPhase === 'pause_end') {
                if (dt >= 1100) {
                    if (isAutoLoop) startWatchAnimation();
                    return;
                }
            }

            animReqId = requestAnimationFrame(stepAnimationFrame);
        }

        function updateLegendHighlight(activeIdx) {
            computedStrokes.forEach((_, idx) => {
                const el = document.getElementById(`legend-pill-${idx}`);
                if (el) {
                    el.classList.toggle('scale-110', idx === activeIdx);
                    el.classList.toggle('ring-2', idx === activeIdx);
                    el.classList.toggle('ring-sky-300', idx === activeIdx);
                }
            });
        }

        // ============================================================================
        // 8. INTERACTIVE MODES: TRACE & FREEHAND WRITE
        // ============================================================================
        function setInteractionMode(mode) {
            interactionMode = mode;
            ['watch', 'trace', 'freehand'].forEach(m => {
                const btn = document.getElementById(`modeBtn-${m}`);
                btn.className = m === mode
                    ? 'px-2.5 sm:px-3 py-1 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer bg-sky-500 text-white shadow-sm'
                    : 'px-2.5 sm:px-3 py-1 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer text-slate-700 hover:text-slate-950';
            });
            applyInteractionModeSetup();
        }

        function applyInteractionModeSetup() {
            stopWatchAnimation();
            const stageGroup = document.getElementById('characterStageGroup');
            const divider = document.getElementById('freehandDivider');
            const clearBtn = document.getElementById('clearBoardBtn');
            const traceCursor = document.getElementById('traceTargetCursor');

            traceCursor.classList.add('hidden');
            clearFreehandBoard();

            if (interactionMode === 'watch') {
                stageGroup.setAttribute('transform', 'translate(0, 0) scale(1)');
                divider.classList.add('hidden');
                clearBtn.classList.add('hidden');
                startWatchAnimation();
            } else if (interactionMode === 'trace') {
                stageGroup.setAttribute('transform', 'translate(0, 0) scale(1)');
                divider.classList.add('hidden');
                clearBtn.classList.add('hidden');
                initGuidedTrace();
            } else if (interactionMode === 'freehand') {
                stageGroup.setAttribute('transform', 'translate(-135, 22) scale(0.85)');
                divider.classList.remove('hidden');
                clearBtn.classList.remove('hidden');
                computedStrokes.forEach(st => {
                    st.pathEl.style.strokeDashoffset = '0px';
                });
            }
        }

        function initGuidedTrace() {
            traceStrokeIdx = 0;
            computedStrokes.forEach((st, idx) => {
                st.pathEl.style.strokeDashoffset = `${st.length}px`;
                st.badgeEl.classList.toggle('active-start-badge', idx === 0);
            });
            prepareTraceSamplesForStroke(0);
        }

        function prepareTraceSamplesForStroke(sIdx) {
            const st = computedStrokes[sIdx];
            if (!st) return;
            traceSamplePoints = [];
            tracePointIdx = 0;
            const steps = Math.max(12, Math.ceil(st.length / 8));
            for (let i = 0; i <= steps; i++) {
                const len = (i / steps) * st.length;
                const pt = st.pathEl.getPointAtLength(len);
                traceSamplePoints.push({ x: pt.x, y: pt.y, len });
            }

            const traceCursor = document.getElementById('traceTargetCursor');
            traceCursor.setAttribute('cx', traceSamplePoints[0].x);
            traceCursor.setAttribute('cy', traceSamplePoints[0].y);
            traceCursor.classList.remove('hidden');
            updateLegendHighlight(sIdx);
        }

        function setupCanvasPointerEvents() {
            const svg = document.getElementById('notebookSvg');

            const getSvgCoords = (e) => {
                const ctm = svg.getScreenCTM();
                if (ctm) {
                    return {
                        x: (e.clientX - ctm.e) / ctm.a,
                        y: (e.clientY - ctm.f) / ctm.d
                    };
                }
                const rect = svg.getBoundingClientRect();
                return {
                    x: ((e.clientX - rect.left) / rect.width) * 640,
                    y: ((e.clientY - rect.top) / rect.height) * 400
                };
            };

            svg.addEventListener('pointerdown', (e) => {
                if (interactionMode === 'watch') return;
                svg.setPointerCapture(e.pointerId);
                isPointerDown = true;
                const pt = getSvgCoords(e);

                if (interactionMode === 'trace') {
                    handleTraceMove(pt);
                } else if (interactionMode === 'freehand') {
                    const drawLayer = document.getElementById('studentDrawLayer');
                    currentFreehandPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    currentFreehandPath.setAttribute('fill', 'none');
                    currentFreehandPath.setAttribute('stroke', '#0284c7');
                    currentFreehandPath.setAttribute('stroke-width', '16');
                    currentFreehandPath.setAttribute('stroke-linecap', 'round');
                    currentFreehandPath.setAttribute('stroke-linejoin', 'round');
                    freehandPoints = [pt];
                    currentFreehandPath.setAttribute('d', `M ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`);
                    drawLayer.appendChild(currentFreehandPath);
                }
            });

            svg.addEventListener('pointermove', (e) => {
                if (!isPointerDown) return;
                const pt = getSvgCoords(e);
                if (interactionMode === 'trace') {
                    handleTraceMove(pt);
                } else if (interactionMode === 'freehand' && currentFreehandPath) {
                    freehandPoints.push(pt);
                    const d = freehandPoints.map((p, i) => (i === 0 ? `M ${p.x.toFixed(1)} ${p.y.toFixed(1)}` : `L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`)).join(' ');
                    currentFreehandPath.setAttribute('d', d);
                }
            });

            const endPointer = () => {
                isPointerDown = false;
                currentFreehandPath = null;
            };
            svg.addEventListener('pointerup', endPointer);
            svg.addEventListener('pointercancel', endPointer);
        }

        function handleTraceMove(pt) {
            const st = computedStrokes[traceStrokeIdx];
            if (!st || traceSamplePoints.length === 0) return;

            // Instant completion for short dot strokes (like on 'i' and 'j')
            if (st.length < 15) {
                const distToDot = Math.hypot(pt.x - st.startPt.x, pt.y - st.startPt.y);
                if (distToDot < 45) {
                    tracePointIdx = traceSamplePoints.length - 1;
                }
            } else {
                // Smoothly advance through sample points even on fast finger swipes
                let progressed = true;
                while (progressed && tracePointIdx < traceSamplePoints.length - 1) {
                    progressed = false;
                    const maxCheck = Math.min(traceSamplePoints.length - 1, tracePointIdx + 6);
                    for (let i = tracePointIdx + 1; i <= maxCheck; i++) {
                        const target = traceSamplePoints[i];
                        if (Math.hypot(pt.x - target.x, pt.y - target.y) < 46) {
                            tracePointIdx = i;
                            progressed = true;
                            break;
                        }
                    }
                }

                const curTarget = traceSamplePoints[tracePointIdx];
                st.pathEl.style.strokeDashoffset = `${st.length - curTarget.len}px`;
                const traceCursor = document.getElementById('traceTargetCursor');
                traceCursor.setAttribute('cx', curTarget.x);
                traceCursor.setAttribute('cy', curTarget.y);
            }

            if (tracePointIdx >= traceSamplePoints.length - 2) {
                st.pathEl.style.strokeDashoffset = '0px';
                st.badgeEl.classList.remove('active-start-badge');
                isPointerDown = false;

                if (traceStrokeIdx + 1 < computedStrokes.length) {
                    traceStrokeIdx++;
                    computedStrokes[traceStrokeIdx].badgeEl.classList.add('active-start-badge');
                    prepareTraceSamplesForStroke(traceStrokeIdx);
                } else {
                    document.getElementById('traceTargetCursor').classList.add('hidden');
                    const curItem = activeList[currentIndex];
                    studentCompletedSet.add(curItem.id);
                    renderCharBar();
                    speakCurrentChar();
                }
            }
        }

        function clearFreehandBoard() {
            document.getElementById('studentDrawLayer').innerHTML = '';
        }

        function toggleGhostTrack() {
            showGhost = !showGhost;
            document.getElementById('ghostLayer').classList.toggle('hidden', !showGhost);
            document.getElementById('chevronLayer').classList.toggle('hidden', !showGhost);
            const btn = document.getElementById('toggleGhostBtn');
            btn.textContent = `Guide: ${showGhost ? 'ON' : 'OFF'}`;
            btn.classList.toggle('opacity-50', !showGhost);
        }

        // ============================================================================
        // 9. PLAYBACK CONTROLS & SPEECH SYNTHESIS
        // ============================================================================
        function prevCharacter() {
            selectCharacter((currentIndex - 1 + activeList.length) % activeList.length);
        }

        function nextCharacter() {
            selectCharacter((currentIndex + 1) % activeList.length);
        }

        function replayCurrent() {
            if (interactionMode === 'trace') initGuidedTrace();
            else if (interactionMode === 'freehand') clearFreehandBoard();
            else startWatchAnimation();
        }

        function toggleAutoLoop() {
            isAutoLoop = !isAutoLoop;
            const btn = document.getElementById('loopBtn');
            const label = document.getElementById('loopLabel');
            label.textContent = isAutoLoop ? 'Loop ON' : 'Loop OFF';
            btn.className = isAutoLoop
                ? 'flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold shadow-md border-b-4 border-emerald-700 transition cursor-pointer'
                : 'flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 font-bold shadow-sm border-b-4 border-slate-300 transition cursor-pointer';
            if (isAutoLoop && interactionMode === 'watch' && animPhase === 'pause_end') {
                startWatchAnimation();
            }
        }

        function toggleSpeed() {
            isSlowSpeed = !isSlowSpeed;
            document.getElementById('speedIcon').textContent = isSlowSpeed ? '🐢' : '🐇';
            document.getElementById('speedLabel').textContent = isSlowSpeed ? 'Slow' : 'Fast';
        }

        function speakCurrentChar() {
            const item = activeList[currentIndex];
            if (!item) return;

            if (currentAudioObj) {
                currentAudioObj.pause();
                currentAudioObj = null;
            }
            window.speechSynthesis?.cancel();

            const pill = document.getElementById('wordSpeakerPill');
            pill.classList.add('speaking-pulse');
            const stopPulse = () => pill.classList.remove('speaking-pulse');

            if (window.TEACHER_AUDIO_BANK[item.id]) {
                currentAudioObj = new Audio(window.TEACHER_AUDIO_BANK[item.id]);
                currentAudioObj.onended = stopPulse;
                currentAudioObj.onerror = stopPulse;
                currentAudioObj.play().catch(stopPulse);
                return;
            }

            if ('speechSynthesis' in window) {
                const textToSpeak = item.type === 'number' ? `${item.word}` : `${item.label}. ${item.word}!`;
                const utter = new SpeechSynthesisUtterance(textToSpeak);
                utter.lang = 'en-US';
                utter.rate = 0.85;
                utter.onend = stopPulse;
                utter.onerror = stopPulse;
                window.speechSynthesis.speak(utter);
            } else {
                setTimeout(stopPulse, 600);
            }
        }

        // ============================================================================
        // 10. TEACHER VOICE STUDIO & CLEAN STUDENT HTML EXPORTER
        // ============================================================================
        function toggleTeacherStudio() {
            const panel = document.getElementById('teacherStudioPanel');
            if (!panel) return;
            panel.classList.toggle('hidden');
            updateStudioUIForCurrentChar();
        }

        function setScriptMode(mode) {
            scriptMode = mode;
            document.getElementById('scriptBtnEn').className = mode === 'en'
                ? 'px-2.5 py-1 rounded-lg bg-sky-500 text-white font-bold transition cursor-pointer'
                : 'px-2.5 py-1 rounded-lg text-slate-300 hover:text-white font-bold transition cursor-pointer';
            document.getElementById('scriptBtnBi').className = mode === 'bi'
                ? 'px-2.5 py-1 rounded-lg bg-sky-500 text-white font-bold transition cursor-pointer'
                : 'px-2.5 py-1 rounded-lg text-slate-300 hover:text-white font-bold transition cursor-pointer';
            updateStudioUIForCurrentChar();
        }

        function updateStudioUIForCurrentChar() {
            if (window.IS_STUDENT_EXPORT) return;
            const item = activeList[currentIndex];
            if (!item) return;

            const badge = document.getElementById('studioTargetBadge');
            if (!badge) return;

            badge.textContent = item.label;
            document.getElementById('teleprompterText').textContent = item.scriptEn;

            const faEl = document.getElementById('teleprompterPersian');
            faEl.textContent = item.scriptFa;
            faEl.classList.toggle('hidden', scriptMode !== 'bi');

            const hasVoice = Boolean(window.TEACHER_AUDIO_BANK[item.id]);
            const statusEl = document.getElementById('studioVoiceStatus');
            if (hasVoice) {
                statusEl.className = 'text-xs font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
                statusEl.textContent = '🎙️ Custom Teacher Voice Saved';
            } else {
                statusEl.className = 'text-xs font-bold px-2 py-0.5 rounded-md bg-slate-700 text-slate-300';
                statusEl.textContent = '🔊 Built-in Synth';
            }
        }

        async function toggleMicRecording() {
            if (isRecording) {
                stopMicRecording();
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                mediaRecorder = new MediaRecorder(micStream);
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const item = activeList[currentIndex];
                        window.TEACHER_AUDIO_BANK[item.id] = reader.result;
                        homeworkSet.add(item.id);
                        updateHomeworkBadges();
                        renderCharBar();
                        updateStudioUIForCurrentChar();
                        document.getElementById('customVoicePillTag').classList.remove('hidden');
                        showStudioToast(`Saved voice for "${item.label}" & added to Homework!`);
                        speakCurrentChar();
                    };
                    reader.readAsDataURL(blob);
                };

                mediaRecorder.start();
                isRecording = true;
                recStartTime = performance.now();
                const recBox = document.getElementById('recordingStatusBox');
                recBox.classList.remove('hidden');
                recBox.classList.add('flex');
                document.getElementById('recordBtnIcon').textContent = '⏹️';
                document.getElementById('recordBtnLabel').textContent = 'Stop';

                recTimerInterval = setInterval(() => {
                    const elapsed = (performance.now() - recStartTime) / 1000;
                    const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                    const secs = (elapsed % 60).toFixed(1).padStart(4, '0');
                    document.getElementById('recTimerText').textContent = `${mins}:${secs}`;

                    if (analyser) {
                        const data = new Uint8Array(analyser.frequencyBinCount);
                        analyser.getByteFrequencyData(data);
                        const avg = data.reduce((a, b) => a + b, 0) / data.length;
                        document.getElementById('micLevelBar').style.width = `${Math.min(100, Math.max(8, avg * 1.5))}%`;
                    }
                }, 80);
            } catch (err) {
                showStudioToast('Microphone access denied or unavailable.');
            }
        }

        function stopMicRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            clearInterval(recTimerInterval);
            isRecording = false;
            const recBox = document.getElementById('recordingStatusBox');
            if (recBox) {
                recBox.classList.add('hidden');
                recBox.classList.remove('flex');
            }
            document.getElementById('recordBtnIcon').textContent = '🔴';
            document.getElementById('recordBtnLabel').textContent = 'Record Mic';
        }

        function handleAudioFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = () => {
                const item = activeList[currentIndex];
                window.TEACHER_AUDIO_BANK[item.id] = reader.result;
                homeworkSet.add(item.id);
                updateHomeworkBadges();
                renderCharBar();
                updateStudioUIForCurrentChar();
                document.getElementById('customVoicePillTag').classList.remove('hidden');
                showStudioToast(`Uploaded audio for "${item.label}" & added to Homework!`);
                speakCurrentChar();
            };
            reader.readAsDataURL(file);
        }

        function deleteCurrentRecording() {
            const item = activeList[currentIndex];
            delete window.TEACHER_AUDIO_BANK[item.id];
            renderCharBar();
            updateStudioUIForCurrentChar();
            document.getElementById('customVoicePillTag').classList.add('hidden');
            showStudioToast(`Cleared custom recording for "${item.label}".`);
        }

        function showStudioToast(msg) {
            const toast = document.getElementById('studioToast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        // Cleanly clone DOM, strip all teacher modals/toolbars, and bake only assigned homework items
        function exportStudentHtml() {
            if (homeworkSet.size === 0) {
                alert('Please select at least 1 item for homework before exporting!');
                return;
            }

            const filteredAudioBank = {};
            homeworkSet.forEach(id => {
                if (window.TEACHER_AUDIO_BANK[id]) {
                    filteredAudioBank[id] = window.TEACHER_AUDIO_BANK[id];
                }
            });

            const assignedIdsArray = Array.from(homeworkSet);

            // Clone the document so we can strip teacher-only modals/panels without affecting the live teacher page
            const clone = document.documentElement.cloneNode(true);
            clone.querySelector('#teacherToolbar')?.remove();
            clone.querySelector('#teacherStudioPanel')?.remove();
            clone.querySelector('#homeworkModal')?.remove();

            // Clear dynamic runtime containers in the clone so the student file boots freshly
            ['charBar', 'ghostLayer', 'chevronLayer', 'airPathLayer', 'inkLayer', 'badgeLayer', 'studentDrawLayer', 'strokeLegend'].forEach(id => {
                const el = clone.querySelector(`#${id}`);
                if (el) el.innerHTML = '';
            });

            let rawHtml = clone.outerHTML;

            rawHtml = rawHtml.replace(
                /\/\*__TEACHER_AUDIO_START__\*\/[\s\S]*?\/\*__TEACHER_AUDIO_END__\*\//,
                () => `/*__TEACHER_AUDIO_START__*/ window.TEACHER_AUDIO_BANK = ${JSON.stringify(filteredAudioBank)}; /*__TEACHER_AUDIO_END__*/`
            );
            rawHtml = rawHtml.replace(
                /\/\*__STUDENT_MODE_START__\*\/[\s\S]*?\/\*__STUDENT_MODE_END__\*\//,
                () => `/*__STUDENT_MODE_START__*/ window.IS_STUDENT_EXPORT = true; /*__STUDENT_MODE_END__*/`
            );
            rawHtml = rawHtml.replace(
                /\/\*__HOMEWORK_CONFIG_START__\*\/[\s\S]*?\/\*__HOMEWORK_CONFIG_END__\*\//,
                () => `/*__HOMEWORK_CONFIG_START__*/ window.HOMEWORK_ASSIGNED_IDS = ${JSON.stringify(assignedIdsArray)}; /*__HOMEWORK_CONFIG_END__*/`
            );

            const blob = new Blob(['<!DOCTYPE html>\n' + rawHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'english_homework_student.html';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
